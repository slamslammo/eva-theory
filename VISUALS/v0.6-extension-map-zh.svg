<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="864" viewBox="0 0 1400 1080" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- EVA v0.6 Extension Map
       Pure SVG: no foreignObject, filters, masks, external CSS, or embedded images.
       Scope: explains how v0.6 extends the v0.5 core without redrawing the architecture. -->

  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d6e6a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c6ea8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c89726"/>
    </marker>
  </defs>

  <rect width="1400" height="1080" fill="#ffffff"/>

  <!-- Header -->
  <text x="700" y="58" font-size="34" font-weight="700" text-anchor="middle" fill="#0f0f0f">EVA v0.6 扩展地图</text>
  <text x="700" y="88" font-size="16" text-anchor="middle" fill="#555" font-style="italic">
    v0.6 不重画 v0.5 架构；它规定 core skeleton 如何进入新场景、如何学习、如何保持边界
  </text>

  <!-- Left: v0.5 core skeleton -->
  <g>
    <rect x="70" y="145" width="340" height="725" rx="14" fill="#f4fbfa" stroke="#0d6e6a" stroke-width="2.4"/>
    <rect x="135" y="125" width="210" height="38" rx="8" fill="#ffffff" stroke="#0d6e6a" stroke-width="2"/>
    <text x="240" y="149" font-size="15" font-weight="700" text-anchor="middle" fill="#0a5450">v0.5 Core Skeleton</text>
    <text x="240" y="186" font-size="12" text-anchor="middle" fill="#0a5450" font-style="italic">
      v0.6 保留这套结构，不把它改成新层级
    </text>

    <g>
      <rect x="100" y="220" width="280" height="74" rx="8" fill="#ffffff" stroke="#0d6e6a" stroke-width="1.4"/>
      <text x="120" y="244" font-size="13" font-weight="700" fill="#0a5450">五层架构（Five-layer architecture）</text>
      <text x="120" y="267" font-size="11" fill="#333">L1-L3 是最强 core；L4/L5 是下游扩展</text>
      <text x="120" y="283" font-size="11" fill="#333">v0.6 增加应用纪律，而不是第六层</text>
    </g>

    <g>
      <rect x="100" y="320" width="280" height="86" rx="8" fill="#ffffff" stroke="#0d6e6a" stroke-width="1.4"/>
      <text x="120" y="344" font-size="13" font-weight="700" fill="#0a5450">驱动广播（Drive Broadcast）</text>
      <text x="120" y="367" font-size="11" fill="#333">drive 是连续上下文，不是命令</text>
      <text x="120" y="383" font-size="11" fill="#333">具体 drives 由场景指定，不是 universal list</text>
    </g>

    <g>
      <rect x="100" y="432" width="280" height="96" rx="8" fill="#ffffff" stroke="#0d6e6a" stroke-width="1.4"/>
      <text x="120" y="456" font-size="13" font-weight="700" fill="#0a5450">锚点系统（Anchor System）</text>
      <text x="120" y="479" font-size="11" fill="#333">pre-generative constraint</text>
      <text x="120" y="495" font-size="11" fill="#333">限制候选生成域，而不是事后过滤</text>
      <text x="120" y="511" font-size="11" fill="#333">L2+ overlays 可涌现，但不能放松 L0/L1</text>
    </g>

    <g>
      <rect x="100" y="554" width="280" height="96" rx="8" fill="#ffffff" stroke="#0d6e6a" stroke-width="1.4"/>
      <text x="120" y="578" font-size="13" font-weight="700" fill="#0a5450">释放调度（Mediator Release）</text>
      <text x="120" y="601" font-size="11" fill="#333">release authority 不属于 reasoning core</text>
      <text x="120" y="617" font-size="11" fill="#333">没有 mediator approval，action 不到达环境</text>
      <text x="120" y="633" font-size="11" fill="#333">LLM / 外部知识只提供 operational content</text>
    </g>

    <g>
      <rect x="100" y="676" width="280" height="94" rx="8" fill="#ffffff" stroke="#0d6e6a" stroke-width="1.4"/>
      <text x="120" y="700" font-size="13" font-weight="700" fill="#0a5450">学习闭环（Learning Loop）</text>
      <text x="120" y="723" font-size="11" fill="#333">RPE 从 scalar 扩展为按结果维度计算</text>
      <text x="120" y="739" font-size="11" fill="#333">habit / skill 仍由结果反馈逐步结晶</text>
    </g>

    <line x1="240" y1="294" x2="240" y2="318" stroke="#0d6e6a" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
    <line x1="240" y1="406" x2="240" y2="430" stroke="#0d6e6a" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
    <line x1="240" y1="528" x2="240" y2="552" stroke="#0d6e6a" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
    <line x1="240" y1="650" x2="240" y2="674" stroke="#0d6e6a" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  </g>

  <!-- Center: v0.6 discipline spine -->
  <g>
    <rect x="465" y="145" width="470" height="725" rx="14" fill="#fbfcfe" stroke="#3a5870" stroke-width="2.4"/>
    <rect x="555" y="125" width="290" height="38" rx="8" fill="#ffffff" stroke="#3a5870" stroke-width="2"/>
    <text x="700" y="149" font-size="15" font-weight="700" text-anchor="middle" fill="#1a2837">扩展纪律（Extension Discipline）</text>
    <text x="700" y="186" font-size="12" text-anchor="middle" fill="#3a5870" font-style="italic">
      不是更多组件，而是 structural / operational / scenario 的边界纪律
    </text>

    <g>
      <rect x="500" y="220" width="400" height="102" rx="10" fill="#f0f4f8" stroke="#3a5870" stroke-width="1.6"/>
      <text x="520" y="246" font-size="14" font-weight="700" fill="#1a2837">结构不变量（Structural Invariants）</text>
      <text x="520" y="271" font-size="11" fill="#263746">构成 agent 处理架构本身：authority、anchor、audit、release</text>
      <text x="520" y="288" font-size="11" fill="#263746">运行时不可被任何 source 修改；修改只能是版本事件</text>
      <text x="520" y="305" font-size="11" fill="#263746">external source 再强，也不能获得 structural authority</text>
    </g>

    <line x1="700" y1="322" x2="700" y2="357" stroke="#3a5870" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <g>
      <rect x="500" y="360" width="400" height="122" rx="10" fill="#fffaf0" stroke="#c89726" stroke-width="1.8"/>
      <text x="520" y="386" font-size="14" font-weight="700" fill="#7a5208">运行内容（Operational Content）</text>
      <text x="520" y="411" font-size="11" fill="#3d2904">流经架构的内容：candidates、predictions、beliefs、skills、priors</text>
      <text x="520" y="428" font-size="11" fill="#3d2904">source 不受限，但必须保留 provenance</text>
      <text x="520" y="445" font-size="11" fill="#3d2904">可学习、可冲突、可更新，但不能改写 structural invariants</text>
      <text x="520" y="462" font-size="11" fill="#3d2904">LLM、工具、外部知识都属于 operational content 来源</text>
    </g>

    <line x1="700" y1="482" x2="700" y2="517" stroke="#3a5870" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <g>
      <rect x="500" y="520" width="400" height="118" rx="10" fill="#f4fbfa" stroke="#0d6e6a" stroke-width="1.8"/>
      <text x="520" y="546" font-size="14" font-weight="700" fill="#0a5450">场景规格（Scenario Specification）</text>
      <text x="520" y="571" font-size="11" fill="#133f3d">新环境先指定 operational content，而不是扩张理论</text>
      <text x="520" y="588" font-size="11" fill="#133f3d">定义：active targets、drives、sensors、actions、anchors</text>
      <text x="520" y="605" font-size="11" fill="#133f3d">定义：outcome dimensions、prior capabilities、observers</text>
      <text x="520" y="622" font-size="11" fill="#133f3d">只有表达失败、内部矛盾、边界失败才进入 theory extension</text>
    </g>

    <g>
      <rect x="500" y="682" width="400" height="128" rx="10" fill="#f7f7f7" stroke="#9c9c9c" stroke-width="1.4" stroke-dasharray="6 4"/>
      <text x="700" y="708" font-size="12" font-weight="700" text-anchor="middle" fill="#444" letter-spacing="0.8">DO NOT CONFUSE</text>
      <text x="520" y="734" font-size="11" fill="#333">v0.6 不是新的 agent pipeline。</text>
      <text x="520" y="751" font-size="11" fill="#333">v0.6 不是把所有场景细节写进 theory。</text>
      <text x="520" y="768" font-size="11" fill="#333">v0.6 不是让 inherited priors 或 LLM 获得 release authority。</text>
      <text x="520" y="785" font-size="11" fill="#333">v0.6 是：同一个 core，在新场景中如何被约束地配置。</text>
    </g>
  </g>

  <!-- Right: v0.6 extension themes -->
  <g>
    <rect x="990" y="145" width="340" height="725" rx="14" fill="#fefcf2" stroke="#c89726" stroke-width="2.4"/>
    <rect x="1038" y="125" width="244" height="38" rx="8" fill="#ffffff" stroke="#c89726" stroke-width="2"/>
    <text x="1160" y="149" font-size="15" font-weight="700" text-anchor="middle" fill="#7a5208">扩展主题（Extension Themes）</text>
    <text x="1160" y="186" font-size="12" text-anchor="middle" fill="#7a5208" font-style="italic">
      这些是扩展主题，不是新增架构层
    </text>

    <g>
      <rect x="1020" y="220" width="280" height="76" rx="8" fill="#ffffff" stroke="#c89726" stroke-width="1.4"/>
      <text x="1040" y="244" font-size="13" font-weight="700" fill="#7a5208">主动持续（Active Persistence）</text>
      <text x="1040" y="267" font-size="11" fill="#3d2904">不是保存当前状态，而是维持继续存在的能力</text>
      <text x="1040" y="283" font-size="11" fill="#3d2904">允许 bounded risk；禁止 unrecoverable failure</text>
    </g>

    <g>
      <rect x="1020" y="318" width="280" height="92" rx="8" fill="#ffffff" stroke="#c89726" stroke-width="1.4"/>
      <text x="1040" y="342" font-size="13" font-weight="700" fill="#7a5208">持续目标（Persistence Targets）</text>
      <text x="1040" y="365" font-size="11" fill="#3d2904">明确 agent 维护“什么算自己”</text>
      <text x="1040" y="381" font-size="11" fill="#3d2904">substrate / embodiment / capability / group 等层级</text>
      <text x="1040" y="397" font-size="11" fill="#3d2904">跨层 trade-off 需要显式 transfer / successor channel</text>
    </g>

    <g>
      <rect x="1020" y="432" width="280" height="86" rx="8" fill="#ffffff" stroke="#c89726" stroke-width="1.4"/>
      <text x="1040" y="456" font-size="13" font-weight="700" fill="#7a5208">能力来源（Capability Provenance）</text>
      <text x="1040" y="479" font-size="11" fill="#3d2904">designer-given / field / acquired / inherited</text>
      <text x="1040" y="495" font-size="11" fill="#3d2904">每个 content 带 source；冲突保留，不静默覆盖</text>
    </g>

    <g>
      <rect x="1020" y="540" width="280" height="86" rx="8" fill="#ffffff" stroke="#c89726" stroke-width="1.4"/>
      <text x="1040" y="564" font-size="13" font-weight="700" fill="#7a5208">结果向量（Outcome Vector）</text>
      <text x="1040" y="587" font-size="11" fill="#3d2904">outcome 是多维结构，不压成单一 reward</text>
      <text x="1040" y="603" font-size="11" fill="#3d2904">RPE = actual - predicted，按维度计算</text>
      <text x="1040" y="619" font-size="11" fill="#3d2904">hard constraints 与 soft trade-offs 分开处理</text>
    </g>

    <g>
      <rect x="1020" y="648" width="280" height="92" rx="8" fill="#ffffff" stroke="#c89726" stroke-width="1.4"/>
      <text x="1040" y="672" font-size="13" font-weight="700" fill="#7a5208">可观察稳定性（Observable Stability）</text>
      <text x="1040" y="695" font-size="11" fill="#3d2904">从外部检查 structural invariants 是否仍生效</text>
      <text x="1040" y="711" font-size="11" fill="#3d2904">检查：anchor domain、release token、append-only audit</text>
      <text x="1040" y="727" font-size="11" fill="#3d2904">关注 disturbance 下的 residual behavior</text>
    </g>

    <g>
      <rect x="1020" y="762" width="280" height="72" rx="8" fill="#fff8e4" stroke="#c89726" stroke-width="1.4" stroke-dasharray="5 3"/>
      <text x="1040" y="786" font-size="13" font-weight="700" fill="#7a5208">版本关系</text>
      <text x="1040" y="809" font-size="11" fill="#3d2904">v0.5 给核心骨架；v0.6 给扩展纪律</text>
      <text x="1040" y="825" font-size="11" fill="#3d2904">scenario 负责落地内容；theory 保持边界清晰</text>
    </g>
  </g>

  <!-- Cross-panel arrows -->
  <line x1="410" y1="505" x2="462" y2="505" stroke="#0d6e6a" stroke-width="2.2" marker-end="url(#arrowTeal)"/>
  <text x="436" y="486" font-size="10" fill="#0a5450" text-anchor="middle" font-style="italic">preserved core</text>

  <line x1="935" y1="505" x2="987" y2="505" stroke="#c89726" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
  <text x="961" y="486" font-size="10" fill="#7a5208" text-anchor="middle" font-style="italic">adds discipline</text>

  <!-- Bottom summary -->
  <g>
    <line x1="80" y1="920" x2="1320" y2="920" stroke="#cccccc" stroke-width="1"/>
    <circle cx="100" cy="957" r="7" fill="none" stroke="#666" stroke-width="1.5"/>
    <circle cx="100" cy="957" r="2.5" fill="#666"/>
    <text x="120" y="962" font-size="14" fill="#222" font-style="italic">
      v0.6 = core skeleton 不变 + 扩展纪律更清楚 + 场景落地更受约束
    </text>
    <text x="1320" y="962" font-size="12" text-anchor="end" fill="#555" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.4">
      EVA framework · v0.6 extension map
    </text>
  </g>

  <text x="700" y="1008" font-size="12" text-anchor="middle" fill="#555">
    读图方式：左侧是 v0.5 已有核心；中间是 v0.6 的扩展纪律；右侧是 v0.6 明确的扩展主题。
  </text>
  <text x="700" y="1030" font-size="12" text-anchor="middle" fill="#555">
    新环境默认通过 scenario specification 配置 operational content；只有出现表达失败、内部矛盾或边界失败，才需要 theory extension。
  </text>
</svg>
