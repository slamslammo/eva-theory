<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1400 900" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <!-- ====================================================================== -->
  <!-- EVA v0.6 — 框架与场景(谁定义存在) · 内容依据: THEORY/v0.6-extension.md (rev2) -->
  <!-- ====================================================================== -->

  <rect width="1400" height="900" fill="#ffffff"/>

  <!-- ============== HEADER ============== -->
  <text x="700" y="56" font-size="31" font-weight="700" text-anchor="middle" fill="#0f0f0f">EVA v0.6 — 框架与场景</text>
  <text x="700" y="88" font-size="16" text-anchor="middle" fill="#555" font-style="italic">框架提供机制;场景声明什么算活着、什么算可恢复中断、什么算死亡</text>

  <!-- ============== LEFT PANEL: 框架(固定) ============== -->
  <g>
    <rect x="70" y="120" width="600" height="660" rx="14" fill="#f4fbfa" stroke="#0d6e6a" stroke-width="2"/>
    <rect x="92" y="142" width="84" height="28" rx="6" fill="#0d6e6a"/>
    <text x="134" y="161" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">框架</text>
    <text x="92" y="206" font-size="21" font-weight="700" fill="#0f0f0f">EVA —— 固定的机制</text>
    <text x="92" y="230" font-size="13" fill="#0a5450" font-style="italic">structural invariants · 与场景无关 · 运行时不可修改</text>

    <g fill="#0a5450"><circle cx="100" cy="266" r="3.2"/><circle cx="100" cy="312" r="3.2"/><circle cx="100" cy="358" r="3.2"/><circle cx="100" cy="404" r="3.2"/><circle cx="100" cy="450" r="3.2"/><circle cx="100" cy="496" r="3.2"/><circle cx="100" cy="542" r="3.2"/></g>

    <text x="116" y="271" font-size="15.5" font-weight="600" fill="#16322f">lifecycle / tick<tspan font-weight="400" fill="#5c6f6d"> —— 心跳;可中断并恢复</tspan></text>
    <text x="116" y="317" font-size="15.5" font-weight="600" fill="#16322f">drive = contextual broadcast<tspan font-weight="400" fill="#5c6f6d"> —— 不是命令</tspan></text>
    <text x="116" y="363" font-size="15.5" font-weight="600" fill="#16322f">anchor = pre-generative restriction<tspan font-weight="400" fill="#5c6f6d"> —— 非事后过滤</tspan></text>
    <text x="116" y="409" font-size="15.5" font-weight="600" fill="#16322f">mediator = 唯一的 release authority</text>
    <text x="116" y="455" font-size="15.5" font-weight="600" fill="#16322f">append-only audit<tspan font-weight="400" fill="#5c6f6d"> · 多维 outcome / RPE</tspan></text>
    <text x="116" y="501" font-size="15.5" font-weight="600" fill="#16322f">persistence hierarchy = 分类语言</text>
    <text x="116" y="519" font-size="12.5" fill="#5c6f6d" font-style="italic">是 target 的种类 —— 不是对"什么算死"的判决</text>
    <text x="116" y="547" font-size="15.5" font-weight="600" fill="#16322f">instance legitimacy + rate-sensing</text>
    <text x="116" y="565" font-size="12.5" fill="#5c6f6d" font-style="italic">状态可恢复 ⇒ 同一个体(存在 ≠ 运行)</text>

    <rect x="92" y="612" width="556" height="138" rx="10" fill="#0d6e6a"/>
    <text x="370" y="652" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">它维持持续存在。</text>
    <text x="370" y="684" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">它不定义死亡。</text>
    <text x="370" y="716" font-size="12.5" text-anchor="middle" fill="#bfe6e3" font-style="italic">机制可以支持 continuity;但绝不重新定义</text>
    <text x="370" y="734" font-size="12.5" text-anchor="middle" fill="#bfe6e3" font-style="italic">场景已声明为"死亡"的东西</text>
  </g>

  <!-- ============== CENTER BOUNDARY ============== -->
  <line x1="700" y1="128" x2="700" y2="772" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="700" y="118" font-size="11" letter-spacing="1.5" text-anchor="middle" fill="#8a8a8a" font-weight="600">结构不变量 ⟷ 场景内容 · 边界</text>
  <g transform="translate(700 450) rotate(-90)">
    <text y="-4" font-size="12.5" text-anchor="middle" fill="#777" font-weight="600">场景声明  ▸  框架读取并遵守</text>
    <text y="14" font-size="11.5" text-anchor="middle" fill="#999" font-style="italic">生命内固定 · 只在部署 / 版本间修订</text>
  </g>

  <!-- ============== RIGHT PANEL: 场景(声明) ============== -->
  <g>
    <rect x="730" y="120" width="600" height="660" rx="14" fill="#fff8ec" stroke="#b5760a" stroke-width="2"/>
    <rect x="752" y="142" width="84" height="28" rx="6" fill="#b5760a"/>
    <text x="794" y="161" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">场景</text>
    <text x="752" y="206" font-size="21" font-weight="700" fill="#0f0f0f">存在场(existence field)</text>
    <text x="752" y="230" font-size="13" fill="#8a5a00" font-style="italic">按部署声明 · 生命内固定</text>

    <rect x="752" y="248" width="556" height="96" rx="10" fill="#fffdf7" stroke="#d6a24a" stroke-width="1.3"/>
    <text x="770" y="274" font-size="13.5" font-weight="700" fill="#8a5a00">它声明的 operational content</text>
    <text x="770" y="300" font-size="14" fill="#4a3a1a">drives · sensors · actions · anchor policies</text>
    <text x="770" y="324" font-size="14" fill="#4a3a1a">outcome dimensions · prior skills</text>

    <rect x="752" y="360" width="556" height="306" rx="10" fill="#fff3dc" stroke="#b5760a" stroke-width="2"/>
    <text x="770" y="388" font-size="14.5" font-weight="700" fill="#8a5a00">★ 它声明的 EXISTENCE SEMANTICS(存在语义)</text>
    <g fill="#b5760a"><circle cx="778" cy="414" r="3"/><circle cx="778" cy="444" r="3"/><circle cx="778" cy="474" r="3"/><circle cx="778" cy="504" r="3"/><circle cx="778" cy="534" r="3"/><circle cx="778" cy="564" r="3"/></g>
    <text x="792" y="419" font-size="14" fill="#3d2f12"><tspan font-weight="700">continuity criterion</tspan> —— 什么算活着</text>
    <text x="792" y="449" font-size="14" fill="#3d2f12"><tspan font-weight="700">recoverable interruption</tspan> —— 可返回的中断</text>
    <text x="792" y="479" font-size="14" fill="#3d2f12"><tspan font-weight="700">terminal failure</tspan> —— 什么使其不可逆终止</text>
    <text x="792" y="509" font-size="14" fill="#3d2f12"><tspan font-weight="700">individual boundary</tspan> —— 一个个体 vs 下一个</text>
    <text x="792" y="539" font-size="14" fill="#3d2f12"><tspan font-weight="700">reset semantics</tspan> —— 重启:同一 / 新个体</text>
    <text x="792" y="569" font-size="14" fill="#3d2f12"><tspan font-weight="700">inheritance channel</tspan> —— 死者如何影响后继</text>
    <rect x="770" y="588" width="520" height="58" rx="8" fill="#b5760a"/>
    <text x="784" y="611" font-size="12.5" font-weight="700" fill="#ffffff">例:Crafter</text>
    <text x="784" y="631" font-size="12.5" fill="#ffe9c7">活着: HP &gt; 0   ·   终止: HP = 0   ·   reset: 新个体</text>
  </g>

  <!-- ============== FOOTER ============== -->
  <text x="700" y="852" font-size="14" text-anchor="middle" fill="#555" font-style="italic">结构不变量固定;存在语义由场景声明。    ·    v0.6 rev2 —— §2 开篇 · §4 · §8.4</text>
</svg>
