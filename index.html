<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVA Theory Visuals</title>
  <style>
    body {
      margin: 0;
      padding: 32px 18px 56px;
      font-family: Arial, Helvetica, sans-serif;
      color: #111111;
      background: #ffffff;
      line-height: 1.5;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 38px;
      line-height: 1.1;
    }
    p {
      max-width: 780px;
      color: #555555;
    }
    a {
      color: #111111;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      margin-top: 28px;
    }
    figure {
      margin: 0;
      border: 1px solid #d8dde6;
      border-radius: 10px;
      padding: 14px;
      background: #fbfcfe;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      background: #ffffff;
      border: 1px solid #edf0f5;
    }
    figcaption {
      margin-top: 10px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>EVA Theory Visuals</h1>
    <p>
      A simple gallery for the SVG diagrams in <code>VISUALS/</code>. These files are explanatory companions to
      the theory, not source-level implementation diagrams.
    </p>
    <p>
      Main repository entries: <a href="README.md">README.md</a> · <a href="README-zh.md">README-zh.md</a>.
    </p>

    <section class="grid">
      <figure>
        <a href="VISUALS/five-layer-overview.svg"><img src="VISUALS/five-layer-overview.svg" alt="EVA five-layer overview"></a>
        <figcaption>Five-Layer Overview</figcaption>
      </figure>
      <figure>
        <a href="VISUALS/signal-flow.svg"><img src="VISUALS/signal-flow.svg" alt="EVA signal flow"></a>
        <figcaption>Signal Flow</figcaption>
      </figure>
      <figure>
        <a href="VISUALS/v0.6-extension-map.svg"><img src="VISUALS/v0.6-extension-map.svg" alt="EVA v0.6 extension map"></a>
        <figcaption>v0.6 Extension Map</figcaption>
      </figure>
    </section>

    <h2>中文图示</h2>
    <section class="grid">
      <figure>
        <a href="VISUALS/five-layer-overview-zh.svg"><img src="VISUALS/five-layer-overview-zh.svg" alt="EVA 五层架构图"></a>
        <figcaption>五层架构图</figcaption>
      </figure>
      <figure>
        <a href="VISUALS/signal-flow-zh.svg"><img src="VISUALS/signal-flow-zh.svg" alt="EVA 信号流图"></a>
        <figcaption>信号流图</figcaption>
      </figure>
      <figure>
        <a href="VISUALS/v0.6-extension-map-zh.svg"><img src="VISUALS/v0.6-extension-map-zh.svg" alt="EVA v0.6 扩展图"></a>
        <figcaption>v0.6 扩展图</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
